name: Run SmartGrocer Scrapers

on:
  schedule:
    # Runs everyday at 19:00 UTC (which is exactly 3:00 AM Malaysia Time GMT+8)
    - cron: '0 19 * * *'
  workflow_dispatch: # Allows you to manually trigger the scraper anytime from GitHub UI

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Scraper and Update Google Sheet
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python scrapers/run_scrapers.py
